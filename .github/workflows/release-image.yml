name: Build and release CM4 image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (for example v2026.10.21)'
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: cm4-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - run: bash scripts/check-project.sh
      - run: python3 -m unittest discover -s tests -v

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          sha=$(git rev-parse HEAD)
          [[ $(git rev-parse "refs/tags/$RELEASE_TAG^{commit}") == "$sha" ]]
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$sha" >> "$GITHUB_OUTPUT"
      - name: Make room on the disposable runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ImageOS bash scripts/prepare-ci-runner.sh
      - name: Install build dependencies
        run: sudo bash scripts/install-host-dependencies.sh
      - name: Build and verify the release image
        run: |
          mkdir -p logs
          sudo env JOBS="$(nproc)" UCONSOLE_BUILD_PROFILE=release bash scripts/build-image.sh 2>&1 | tee logs/build.log
      - name: Compress image and collect source and verification files
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: sudo --preserve-env=RELEASE_TAG,GITHUB_REPOSITORY,GITHUB_RUN_ID python3 scripts/package-release.py
      - name: Save release assets for the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm4-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm4-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            docs/root-verification.json
            docs/installed-packages.tsv
            docs/final-upgrade-check.txt
            docs/hardware-helper-tests.txt
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cm4-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: bash scripts/publish-release.sh
